    <script>
      const SRC = `import type { Upload, UploadResult } from './types';
import { backoff, sleep } from './retry';

const MAX_ATTEMPTS = 5;

export class UploadQueue {
  private active = 0;
  private readonly pending: Upload[] = [];

  /** Adds an upload; resolves once it has finally succeeded or failed. */
  enqueue(upload: Upload): Promise<UploadResult> {
    return new Promise((resolve, reject) => {
      this.pending.push({ ...upload, resolve, reject });
      void this.drain();
    });
  }

  private async attempt(upload: Upload, n = 1): Promise<UploadResult> {
    try {
      return await this.send(upload);
    } catch (err) {
      if (n >= MAX_ATTEMPTS) throw err;
      await sleep(backoff(n));
      return this.attempt(upload, n + 1);
    }
  }
}
`.split('\n');
      SRC.pop();
      const KW = /^(import|from|export|class|const|let|private|readonly|constructor|return|new|if|throw|await|async|try|catch|finally|while|void|type)$/;
      const esc = (s) => s.replace(/&/g, '&amp;').replace(/</g, '&lt;');
      function hl(line) {
        const out = [];
        const re = /(\/\*\*.*\*\/)|('[^']*')|(\b\d+\b)|([A-Za-z_$][\w$]*)|(\s+)|(.)/g;
        let m;
        let prev = '';
        while ((m = re.exec(line))) {
          const [t, cm, str, num, id] = m;
          let cls = '';
          if (cm) cls = 'c';
          else if (str) cls = 's';
          else if (num) cls = 'n';
          else if (id) {
            const next = line.slice(re.lastIndex).match(/^\s*(\(|<)/);
            if (KW.test(id)) cls = 'k';
            else if (/^[A-Z]/.test(id)) cls = 't';
            else if (prev === '.' && next && next[1] === '(') cls = 'f';
            else if (next && next[1] === '(') cls = 'f';
            else if (prev === '.') cls = 'p';
          }
          if (!/^\s+$/.test(t)) prev = t.length === 1 && !id ? t : id ? 'id' : prev;
          out.push(cls ? `<span class="${cls}">${esc(t)}</span>` : esc(t));
        }
        return out.join('');
      }
      const CUR = 21;
      document.getElementById('lines').innerHTML = SRC.map((l, i) => `<div${i === CUR ? ' class="cur"' : ''}>${hl(l) || '&nbsp;'}</div>`).join('');
      document.getElementById('ln').innerHTML = SRC.map((_, i) => `<div style="height:22px"${i === CUR ? ' class="cur"' : ''}>${i + 1}</div>`).join('');
    </script>
