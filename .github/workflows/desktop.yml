name: desktop

# Windows installers (NSIS + MSI) plus the capture-latency measurement, on demand. The checks that run on
# every push and pull request (cargo fmt, clippy -D warnings, cargo test --workspace, typecheck, Vitest,
# the desktop UI e2e) live in ci.yml; the signed release build lives in release.yml. This workflow is for
# trying an installer from any branch without tagging a release, and can be called from another workflow.
#
# Installer artifacts are unsigned. The build date is embedded from the runner's clock (or from
# SOURCE_DATE_EPOCH if a caller sets it); see apps/desktop/src-tauri/build.rs.

on:
  workflow_dispatch:
  workflow_call:

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  desktop:
    name: Installers and capture latency
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The pnpm version comes from "packageManager" in the root package.json.
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      # windows-latest ships MSVC; this is the release target (x86_64-pc-windows-msvc).
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile

      # The capture-latency test is an ignored test of polishot-desktop-core (the Tauri-free crate that
      # holds the platform code; the Tauri crate itself has no test target). It grabs the screen, so it
      # needs an interactive desktop session and is informational only.
      - name: Capture latency (informational)
        continue-on-error: true
        run: cargo test --release -p polishot-desktop-core -- --ignored capture_latency --nocapture

      # beforeBuildCommand in tauri.conf.json builds the frontend first.
      - name: Build installers (NSIS + MSI)
        run: pnpm --filter @polishot/desktop tauri build --bundles nsis,msi

      # The Cargo workspace puts output in the root target/ directory.
      - name: Collect installers
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist-installers | Out-Null
          $nsis = @(Get-ChildItem -Path target/release/bundle/nsis -Filter *-setup.exe -ErrorAction SilentlyContinue)
          $msi = @(Get-ChildItem -Path target/release/bundle/msi -Filter *.msi -ErrorAction SilentlyContinue)
          if ($nsis.Count -ne 1 -or $msi.Count -ne 1) {
            Get-ChildItem -Recurse target/release/bundle -ErrorAction SilentlyContinue | Select-Object FullName
            throw "Expected exactly one NSIS installer and one MSI, found $($nsis.Count) and $($msi.Count)."
          }
          Copy-Item $nsis[0].FullName dist-installers/Polishot-Setup-x64.exe
          Copy-Item $msi[0].FullName dist-installers/Polishot-x64.msi

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: polishot-windows-x64
          path: dist-installers/*
          if-no-files-found: error
          retention-days: 14
