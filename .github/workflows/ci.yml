name: CI

# Root CI for the whole monorepo. Per-app workflows (desktop.yml, android.yml) add installers and
# emulator tests; this one gives a single required check for every push and pull request to main.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  js:
    name: JS (typecheck, unit, web build, e2e, Lighthouse)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Version comes from "packageManager" in the root package.json.
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm -r --if-present typecheck

      - name: Unit tests
        run: pnpm -r --if-present test

      - name: Build website
        run: pnpm --filter @polishot/web build

      # One browser install serves both packages (both pin @playwright/test 1.65.0).
      - name: Install Playwright Chromium
        run: pnpm --filter @polishot/web exec playwright install --with-deps chromium

      - name: Editor e2e
        run: pnpm --filter @polishot/editor test:e2e

      - name: Website e2e
        run: pnpm --filter @polishot/web e2e

      # Uses the production build from "Build website"; budgets live in apps/web/lighthouserc.json.
      - name: Lighthouse CI
        run: pnpm --filter @polishot/web lhci

      - name: Upload Playwright and Lighthouse reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: js-reports
          path: |
            apps/web/test-results/
            apps/web/.lighthouseci/
            packages/editor/test-results/artifacts/
          if-no-files-found: ignore
          retention-days: 14

  rust:
    name: Rust (Windows MSVC, fmt, clippy, test)
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      # windows-latest ships MSVC, so this is x86_64-pc-windows-msvc, the release target.
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch
        with:
          toolchain: stable
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: cargo fmt
        run: cargo fmt --all --check

      # tauri::generate_context! embeds build.frontendDist (apps/desktop/dist) at compile time,
      # so the desktop frontend must be built before clippy and test compile the crate.
      - name: Build desktop frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter @polishot/desktop build

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: cargo test
        run: cargo test --workspace

  rust-crates-linux:
    name: Rust crates (Linux, fast)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: cargo test (platform-independent crates)
        run: cargo test -p polishot-license -p polishot-media -p polishot-quicksend

  # android.yml has no `on: workflow_call` yet, so the unit tests run inline here. Once it does,
  # replace this job with:  android: { uses: ./.github/workflows/android.yml, secrets: inherit }
  android:
    name: Android (unit tests)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GRADLE_OPTS: -Dorg.gradle.daemon=false -Dorg.gradle.jvmargs=-Xmx3g
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The Gradle build runs the editor-host Vite build itself, so it needs pnpm and node_modules.
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile

      - name: Accept Android SDK licences
        run: yes | "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Gradle unit tests
        working-directory: apps/android
        run: |
          chmod +x ./gradlew
          ./gradlew test --stacktrace

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-unit-reports
          path: |
            apps/android/app/build/reports/tests/
            apps/android/quicksend/build/reports/tests/
          if-no-files-found: ignore
          retention-days: 14
