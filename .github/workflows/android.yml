name: Android

# Builds, tests and lints the Android app (apps/android) and, on request, runs the instrumented tests on an
# emulator. Artifacts: Polishot.apk and Polishot.aab.
#
# Reusable workflow: the root CI (.github/workflows/ci.yml) calls it with `uses: ./.github/workflows/android.yml`.
# It has no push or pull_request trigger of its own, so a push is built once (by the caller), not twice.
# It can also be started by hand from the Actions tab (workflow_dispatch).
#
# Signing: with the optional secrets below the release APK/AAB are signed with your keystore; without them they
# are signed with the debug key (fine for testing, not for the Play Store). The root CI deliberately does not
# pass them (no `secrets: inherit`), because release.yml does the real signing on a version tag.
#
# The emulator job (about an hour) only runs when `emulator` is true.

on:
  workflow_call:
    inputs:
      emulator:
        description: Also run the instrumented tests (connectedCheck) on an API 34 emulator.
        type: boolean
        required: false
        default: false
    secrets:
      POLISHOT_KEYSTORE_BASE64:
        required: false
      POLISHOT_KEYSTORE_PASSWORD:
        required: false
      POLISHOT_KEY_ALIAS:
        required: false
      POLISHOT_KEY_PASSWORD:
        required: false
  workflow_dispatch:
    inputs:
      emulator:
        description: Also run the instrumented tests (connectedCheck) on an API 34 emulator.
        type: boolean
        required: false
        default: false

permissions:
  contents: read

env:
  # The Gradle build runs `pnpm --filter @polishot/android-editor-host build` itself (task buildEditorHost).
  GRADLE_OPTS: -Dorg.gradle.daemon=false -Dorg.gradle.jvmargs=-Xmx3g

jobs:
  build:
    name: Build, test, lint
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Editor host tests and type check
        run: |
          pnpm --filter @polishot/android-editor-host typecheck
          pnpm --filter @polishot/android-editor-host test

      - name: Accept Android SDK licences
        run: yes | "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Release signing (only when the secrets exist)
        env:
          KEYSTORE_BASE64: ${{ secrets.POLISHOT_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.POLISHOT_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.POLISHOT_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.POLISHOT_KEY_PASSWORD }}
        run: |
          if [ -n "${KEYSTORE_BASE64}" ]; then
            echo "${KEYSTORE_BASE64}" | base64 --decode > "${RUNNER_TEMP}/polishot.keystore"
            {
              echo "POLISHOT_KEYSTORE=${RUNNER_TEMP}/polishot.keystore"
              echo "POLISHOT_KEYSTORE_PASSWORD=${KEYSTORE_PASSWORD}"
              echo "POLISHOT_KEY_ALIAS=${KEY_ALIAS}"
              echo "POLISHOT_KEY_PASSWORD=${KEY_PASSWORD}"
            } >> "${GITHUB_ENV}"
            echo "Release keystore configured."
          else
            echo "No keystore secrets: release builds use the debug signing key."
          fi

      - name: Unit tests, lint, release APK and bundle
        working-directory: apps/android
        run: |
          chmod +x ./gradlew
          ./gradlew test :quicksend:test lint assembleRelease bundleRelease --stacktrace

      - name: Name the artifacts
        run: |
          mkdir -p dist
          cp apps/android/app/build/outputs/apk/release/app-release.apk dist/Polishot.apk
          cp apps/android/app/build/outputs/bundle/release/app-release.aab dist/Polishot.aab

      - name: Upload Polishot.apk
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Polishot.apk
          path: dist/Polishot.apk
          if-no-files-found: error

      - name: Upload Polishot.aab
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Polishot.aab
          path: dist/Polishot.aab
          if-no-files-found: error

      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-reports
          path: |
            apps/android/app/build/reports/**
            apps/android/app/build/test-results/**
            apps/android/quicksend/build/reports/**
            apps/android/quicksend/build/test-results/**
          if-no-files-found: ignore

  instrumented:
    name: Emulator tests (API 34)
    if: ${{ inputs.emulator }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Accept Android SDK licences
        run: yes | "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Build the editor host (the emulator job runs Gradle inside the emulator action)
        run: pnpm --filter @polishot/android-editor-host build

      - name: connectedCheck
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          working-directory: apps/android
          script: chmod +x ./gradlew && ./gradlew -PskipEditorBuild connectedCheck --stacktrace

      - name: Upload instrumented reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-instrumented-reports
          path: apps/android/app/build/reports/androidTests/**
          if-no-files-found: ignore
