# Project-wide Gradle settings for the Polishot Android app.

org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

# AndroidX only; no legacy support libraries.
android.useAndroidX=true

# Kotlin style used by the Android Studio formatter.
kotlin.code.style=official
