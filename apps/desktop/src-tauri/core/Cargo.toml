[package]
name = "polishot-desktop-core"
version = "0.1.0"
description = "Platform logic for the Polishot desktop app: capture, OCR, history, settings, license. No Tauri dependency, so its tests run as plain executables."
edition = "2021"
rust-version = "1.85"
publish = false

[lib]
name = "polishot_core"
path = "src/lib.rs"

[dependencies]
global-hotkey = "=0.8.0"
polishot-license = { path = "../../../../crates/polishot-license" }
polishot-media = { path = "../../../../crates/polishot-media" }
polishot-quicksend = { path = "../../../../crates/polishot-quicksend" }
windows-capture = "=2.0.1"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
rusqlite = { version = "=0.41.1", features = ["bundled"] }
image = { version = "=0.25.10", default-features = false, features = ["png", "jpeg", "webp", "bmp"] }

[dependencies.windows]
version = "=0.62.2"
features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_Graphics_Dwm",
  "Win32_UI_WindowsAndMessaging",
  "Win32_UI_HiDpi",
  "Win32_UI_Shell",
  "Win32_System_Threading",
  "Win32_System_DataExchange",
  "Win32_System_Memory",
  "Win32_System_Ole",
  "Win32_System_Com",
  "Win32_System_WinRT",
  "Win32_Security_Credentials",
  "Win32_Security_Cryptography",
  "Win32_UI_Input_KeyboardAndMouse",
  "Media_Ocr",
  "Globalization",
  "Graphics_Imaging",
  "Storage",
  "Storage_Streams",
  "Foundation",
  "Foundation_Collections",
  "ApplicationModel_DataTransfer",
]
